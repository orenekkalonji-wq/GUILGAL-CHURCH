<title>Cité Évangélique Guilgal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concept : application mobile en colonne unique, en-tête, contenu défilant, barre d'onglets en bas. Vert profond + ambre pour les moments forts. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --fg: #121A2E;
  --muted: #5A6579;
  --line: #D9DFEA;
  --accent: #1A3FB0;
  --accent-fg: #FFFFFF;
  --gold: #D12B2B;
  --gold-soft: #FBF0D9;
  --warn: #B87503;
  --hero-bg: #12286B;
  --hero-fg: #F4F6FC;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B101D; --surface: #141C30; --fg: #E8ECF6; --muted: #98A3BA; --line: #263050;
    --accent: #8CA8FF; --accent-fg: #0A1330; --gold: #F0554F; --gold-soft: #2D2410; --warn: #E9B44C;
    --hero-bg: #13296E; --hero-fg: #F4F6FC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B101D; --surface: #141C30; --fg: #E8ECF6; --muted: #98A3BA; --line: #263050;
  --accent: #8CA8FF; --accent-fg: #0A1330; --gold: #F0554F; --gold-soft: #2D2410; --warn: #E9B44C;
  --hero-bg: #13296E; --hero-fg: #F4F6FC;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
* { box-sizing: border-box; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin-inline: auto; }
.top { padding: 14px 16px 10px; display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid var(--line); display: grid; place-items: center; flex: none; overflow: hidden; }
.mark img { width: 38px; height: 38px; object-fit: contain; display: block; }
.top h1 { font: 700 1.1rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: .8rem; }
main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.demo { background: var(--gold-soft); color: var(--fg); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .82rem; }
.hero { background: var(--hero-bg); color: var(--hero-fg); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin: 0; }
.hero h2 { font: 700 1.6rem/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.hero .when { font-size: 1rem; margin: 0; }
.pill { align-self: flex-start; margin-top: 8px; background: #E23B3B; color: #FFFFFF; font-weight: 600; font-size: .8rem; padding: 4px 12px; border-radius: 999px; }
.verse { border-left: 3px solid var(--gold); padding: 2px 0 2px 14px; }
.verse p { margin: 0; font: 500 1.15rem/1.35 var(--font-display); text-wrap: balance; }
.verse small { color: var(--muted); }
h3 { font: 700 1.05rem/1.2 var(--font-display); margin: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { background: none; border: 0; color: var(--accent); font: 600 .9rem var(--font-body); padding: 6px 0; cursor: pointer; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; }
.row > div { min-width: 0; }
.row b { display: block; font-weight: 600; }
.row span.sub { color: var(--muted); font-size: .88rem; }
.date { flex: none; width: 54px; text-align: center; border-radius: 10px; background: var(--bg); padding: 6px 0; }
.date strong { display: block; font: 700 1.35rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.date small { text-transform: uppercase; letter-spacing: .08em; font-size: .68rem; color: var(--muted); }
.time { flex: none; margin-left: auto; font-weight: 600; font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--accent); }
.day { flex: none; width: 54px; font: 700 .95rem var(--font-display); }
.is-next { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.copy { flex: none; margin-left: auto; background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 10px; font: 600 .82rem var(--font-body); padding: 8px 12px; min-height: 40px; cursor: pointer; }
.value { overflow-wrap: anywhere; user-select: all; }
.note { color: var(--muted); font-size: .85rem; margin: 0; }
.note-line { display: block; margin-top: 4px; font-style: italic; }
nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav button { background: none; border: 0; color: var(--muted); font: 500 .7rem var(--font-body); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 52px; cursor: pointer; border-radius: 12px; }
nav button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
nav svg { width: 22px; height: 22px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[role="tabpanel"] { display: flex; flex-direction: column; gap: 14px; }
@media (prefers-reduced-motion: no-preference) {
  [role="tabpanel"]:not([hidden]) { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Dons
    </button>
    <button role="tab" id="t-contact" data-tab="contact" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Contact
    </button>
  </nav>
</div>

<script>
/* Toutes les informations de l'église sont ici. Modifiez ce bloc. */
const CHURCH = {
  name: "Cité Évangélique Guilgal",
  city: "Lubumbashi, RDC",
  verse: { text: "Oubliant ce qui est en arrière et me portant vers ce qui est en avant, je cours vers le but.", ref: "Philippiens 3:13-14" },
  services: [
    { day: 1, h: 17, m: 0,  eh: 18, em: 0,  title: "Intercession générale" },
    { day: 2, h: 6,  m: 0,  eh: 7,  em: 0,  title: "Dévotion matinale" },
    { day: 2, h: 16, m: 0,  eh: 18, em: 0,  title: "Culte de louange et adoration" },
    { day: 3, h: 6,  m: 0,  eh: 7,  em: 0,  title: "Dévotion matinale" },
    { day: 3, h: 16, m: 0,  eh: 18, em: 0,  title: "Culte d'enseignement" },
    { day: 4, h: 6,  m: 0,  eh: 7,  em: 0,  title: "Dévotion matinale" },
    { day: 4, h: 17, m: 0,  eh: 18, em: 0,  title: "Intercession générale" },
    { day: 5, h: 6,  m: 0,  eh: 7,  em: 0,  title: "Dévotion matinale" },
    { day: 5, h: 16, m: 0,  eh: 18, em: 0,  title: "Culte jeune et prière" },
    { day: 0, h: 8,  m: 0,  eh: 11, em: 30, title: "Service dominical" }
  ],
  events: [
    { date: "2026-10-18", title: "Louons-le sans cesse", place: "Concert, chorale Chemin de la Vie", time: "14h30–18h30",
      note: "Je veux bénir l'Éternel en tout temps : sa louange sera toujours dans ma bouche." }
  ],
  give: [
    { label: "M-Pesa", number: "+243 810 073 024", name: "" },
    { label: "Airtel Money", number: "09 73 97 97 52", name: "" }
  ],
  contact: [
    { label: "Adresse", value: "N° 41, avenue 4, quartier Kaponda Nord, commune de Katuba VI, Lubumbashi" },
    { label: "Point de repère", value: "Matunga" },
    { label: "Téléphone", value: "09 73 97 97 52" },
    { label: "E-mail", value: "orenekkalonji@gmail.com" }
  ]
};

const DAYS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const DAYS_SHORT = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MONTHS_SHORT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const hm = (h, m) => h + "h" + pad(m);

function nextOccurrence(svc, now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), svc.h, svc.m, 0);
  d.setDate(d.getDate() + ((svc.day - now.getDay() + 7) % 7));
  if (d <= now) d.setDate(d.getDate() + 7);
  return d;
}
function describeIn(target, now) {
  const mins = Math.round((target - now) / 60000);
  if (mins < 60) return "Dans " + mins + " min";
  const sameDay = target.toDateString() === now.toDateString();
  if (sameDay) return "Aujourd'hui";
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  if (target.toDateString() === tomorrow.toDateString()) return "Demain";
  const days = Math.round((new Date(target.getFullYear(), target.getMonth(), target.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  return "Dans " + days + " jours";
}
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }

function eventRow(ev) {
  const d = parseDate(ev.date);
  return '<div class="row"><div class="date"><strong>' + d.getDate() + '</strong><small>' + MONTHS_SHORT[d.getMonth()] +
    '</small></div><div><b>' + ev.title + '</b><span class="sub">' + DAYS[d.getDay()] + " · " + ev.place +
    '</span>' + (ev.note ? '<span class="sub note-line">Thème : ' + ev.note + '</span>' : '') + '</div><span class="time">' + ev.time + '</span></div>';
}

function render() {
  const now = new Date();
  $("church-name").textContent = CHURCH.name;
  $("church-city").textContent = CHURCH.city;
  document.title = CHURCH.name === "Nom de votre église" ? "Mon Église" : CHURCH.name;
  $("verse-text").textContent = "« " + CHURCH.verse.text + " »";
  $("verse-ref").textContent = CHURCH.verse.ref;

  const upcoming = CHURCH.services.map((s) => ({ s, at: nextOccurrence(s, now) })).sort((a, b) => a.at - b.at);
  const next = upcoming[0];
  $("next-title").textContent = next.s.title;
  $("next-when").textContent = DAYS[next.at.getDay()] + " " + next.at.getDate() + " " + MONTHS[next.at.getMonth()] + " · " + hm(next.s.h, next.s.m) + " – " + hm(next.s.eh, next.s.em);
  $("next-in").textContent = describeIn(next.at, now);

  const sorted = CHURCH.services.slice().sort((a, b) => ((a.day + 6) % 7) - ((b.day + 6) % 7) || (a.h * 60 + a.m) - (b.h * 60 + b.m));
  $("services").innerHTML = sorted.map((s, i) =>
    '<div class="row' + (s === next.s ? " is-next" : "") + '"><span class="day">' + (i === 0 || sorted[i - 1].day !== s.day ? DAYS_SHORT[s.day] : "") + '</span><div><b>' +
    s.title + '</b></div><span class="time">' + hm(s.h, s.m) + "–" + hm(s.eh, s.em) + '</span></div>').join("");

  const events = CHURCH.events.filter((e) => parseDate(e.date) >= new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    .sort((a, b) => a.date.localeCompare(b.date));
  $("events").innerHTML = events.length ? events.map(eventRow).join("") : '<p class="note">Aucun événement prévu pour le moment.</p>';
  $("home-events").innerHTML = events.slice(0, 2).map(eventRow).join("") || '<p class="note">Aucun événement prévu pour le moment.</p>';

  $("give").innerHTML = CHURCH.give.map((g, i) =>
    '<div class="row"><div><b>' + g.label + '</b><span class="sub value" id="g' + i + '">' + g.number + '</span>' + (g.name ? '<span class="sub"> · ' + g.name + '</span>' : '') +
    '</div><button class="copy" data-copy="g' + i + '">Copier</button></div>').join("");

  $("contact").innerHTML = CHURCH.contact.map((c, i) =>
    '<div class="row"><div><span class="sub">' + c.label + '</span><b class="value" id="c' + i + '">' + c.value +
    '</b></div><button class="copy" data-copy="c' + i + '">Copier</button></div>').join("");
}

function show(tab) {
  document.querySelectorAll("[role=tabpanel]").forEach((p) => { p.hidden = p.id !== "tab-" + tab; });
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("main").scrollTop = 0;
  try { localStorage.setItem("eglise-tab", tab); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) return show(tabBtn.dataset.tab);
  const go = e.target.closest("[data-go]");
  if (go) return show(go.dataset.go);
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const el = $(cp.dataset.copy);
    const done = () => { cp.textContent = "Copié"; setTimeout(() => { cp.textContent = "Copier"; }, 1500); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try {
      navigator.clipboard.writeText(el.textContent).then(done, select);
    } catch (err) { select(); }
  }
});

render();
setInterval(render, 60000);
try { const t = localStorage.getItem("eglise-tab"); if (t && $("tab-" + t)) show(t); } catch (e) {}
</script>
